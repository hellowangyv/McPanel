{% extends '_base.html' %}
{% block title %}注册{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-top-strip">
    <div class="dots"><span></span><span></span><span></span></div>
    <span>McPanel · 新玩家登记 // USER ENROLLMENT</span>
    <span class="pill-dot" style="width:8px;height:8px;background:var(--primary);box-shadow:0 0 6px var(--primary);animation:pillPulse 1.2s infinite;border-radius:50%"></span>
  </div>
  <a class="auth-brand" href="{{ url_for('landing') }}">
    <span class="brand-mark" aria-hidden="true">
      <span class="bm bm-1"></span><span class="bm bm-2"></span><span class="bm bm-3"></span>
    </span>
    <span>McPanel</span>
  </a>
  <h1>创建你的账号</h1>
  <p class="auth-sub">注册即送 2 台服务器 / 4G 内存配额，免费永久使用</p>
  <form method="post" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <label>
      <span>用户名 (3-20 字符)</span>
      <input type="text" name="username" minlength="3" maxlength="20" required autofocus autocomplete="username" />
    </label>
    <label>
      <span>邮箱</span>
      <input type="email" name="email" required autocomplete="email" />
    </label>
    <label>
      <span>密码 (至少 6 位)</span>
      <input type="password" name="password" minlength="6" required autocomplete="new-password" />
    </label>
    <label>
      <span>再次输入密码</span>
      <input type="password" name="password2" minlength="6" required autocomplete="new-password" />
    </label>
    <button class="btn btn-primary btn-block btn-lg" type="submit">
      <i data-i="plus" style="width:12px;height:12px"></i>
      注册并开服
    </button>
  </form>
  <div class="auth-divider"><span>或</span></div>
  <a class="btn btn-outline btn-block" href="{{ url_for('auth_login') }}">已有账号? 直接登录</a>
  <div class="auth-hint">
    <div>▸ 注册成功即赠送：</div>
    <div>◆ 2 台服务器名额　◆ 4096MB 内存配额</div>
    <div>◆ 2 核心共享　◆ 67 天超长数据保留</div>
  </div>
</div>
{% endblock %}
